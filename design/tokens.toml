selection_foreground = "@ink_1"

[terminal.palette]
# colour-proofs §N: green slots carry green; slot 9 is a light clay, never arm.
field = ["#262b5b", "#9b3a1f", "#32671c", "#7d5e07", "#354faa", "#77398a", "#076b6f", "#414970", "#525a7c", "#892504", "#265511", "#694e00", "#283f92", "#642b74", "#04585c", "#262b5b"]
night = ["#30354e", "#d98d73", "#99c77f", "#d9c37f", "#99adf7", "#ce9bdf", "#76c8c7", "#e2d2cb", "#979db4", "#edac93", "#bbe2a6", "#ecdeaa", "#bdccfd", "#e1c0ec", "#a6e1e0", "#f2e9e2"]

[tmux]
# CONTROL's server: seams between split panes, titled panes (Bloom spec §2.4).
pane_border = "@seam"
pane_active_border = "@ink_4"
pane_title = "@ink_4"
pane_title_active = "@ink_1"
message_background = "@raised"
message_foreground = "@ink_1"
mode_background = "@blue_wash"
mode_foreground = "@ink_1"

[claude]
# ~/.claude/themes/control.json, selected with "theme": "custom:control". Arm stays out; error
# is ink; the diff keys follow the diff roles whatever this table says.
name = "CONTROL"
base = { field = "light-ansi", night = "dark-ansi" }

[claude.overrides]
autoAccept = "@ink_3"
skill = "@ink_2"
bashBorder = "@ink_3"
claude = "@ink_1"
