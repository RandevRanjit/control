text_caption = "@ink_4"
text_disabled = "@ghost"
# Lamps carry no hue (B6): state colour lives in the bar.
lamp_needs = "@ink_1"
lamp_failed = "@ink_1"
lamp_done = "@ink_1"
lamp_working = "@ink_1"
lamp_bg = "@ink_1"
lamp_choose = "@ink_3"
lamp_house = "@ink_4"
lamp_outside = "@ink_4"
lamp_idle = "@ink_4"
lamp_gone = "@ink_4"
lamp_band = "@field"
lamp_bridge = "@seam"
st_needs = "@arm"
st_failed = "@amber_base"
st_done = "@bar_green_b"
st_working = "@bar_blue_b"
st_bg = "@bar_blue_l"
st_choose = "@bar_lilac_b"
st_house = "@rs_a"
st_outside = "@ink_4"
st_idle = "@seam"
st_gone = "@seam"
bar_track = "@sunken"
focus = { field = "@blue_base", night = "@blue_light" }
link = { field = "@blue_deep", night = "@blue_light" }
trace_read = { field = "@blue_deep", night = "@blue_light" }
trace_write = { field = "@green_deep", night = "@green_light" }
trace_agent = { field = "@lilac_deep", night = "@lilac_light" }
trace_error = "@ink_1"
trace_live = { field = "@ink_2", night = "@cream" }
# Diffs (B10): removed a rose wash below the well, added a sage wash above it; never arm.
diff_add_wash = "@green_wash"
diff_add_word = "@green_word"
diff_add_mark = { field = "@green_deep", night = "@green_light" }
diff_rem_wash = "@rose_wash"
diff_rem_word = "@rose_word"
diff_rem_mark = { field = "@rose_deep", night = "@rose_light" }
use_ink = "@ink_1"
use_track = "@sunken"
rim = "@cream"
chain_empty = "@seam"
wave_hi = { field = "@blue_base", night = "@blue_light" }
toggle_on = { field = "@blue_base", night = "@blue_deep" }
# The bridge a bar change passes through, and the safe ramp's plateaus: never inside a bar.
wine = { field = "#5c2b40", night = "#5c2b40" }
rs_a = { field = "#333964", night = "#dbc3c2" }
rs_b = { field = "#305d12", night = "#a2ce72" }
rs_c = { field = "#2b44a6", night = "#9cb0fb" }

[bar]
# One smooth ramp per state inside its family: 21 stops at k/20, first = last, so a tile repeats
# with no seam. Working and Background share one bar. Flowed by transform only, never `colors`.
