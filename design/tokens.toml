done = { field = ["#5da12a", "#6eab3c", "#7db54a", "#89bc55", "#90c15c", "#93c35e", "#90c15c", "#89bc55", "#7db54a", "#6eab3c", "#5da12a", "#529625", "#488d20", "#40851c", "#3b811a", "#397f19", "#3b811a", "#40851c", "#488d20", "#529625", "#5da12a"], night = ["#7cc74b", "#8dce59", "#9bd364", "#a6d86d", "#aedb73", "#b0dc75", "#aedb73", "#a6d86d", "#9bd364", "#8dce59", "#7cc74b", "#6bb942", "#5cac3a", "#4fa234", "#479c30", "#449a2f", "#479c30", "#4fa234", "#5cac3a", "#6bb942", "#7cc74b"] }
failed = { field = ["#e4b125", "#e8bc3d", "#ebc64f", "#eece5b", "#efd362", "#f0d565", "#efd362", "#eece5b", "#ebc64f", "#e8bc3d", "#e4b125", "#dba722", "#d29e20", "#cc971f", "#c7931d", "#c6911d", "#c7931d", "#cc971f", "#d29e20", "#dba722", "#e4b125"], night = ["#fccf47", "#fcd65f", "#fddd71", "#fde27f", "#fde587", "#fde68a", "#fde587", "#fde27f", "#fddd71", "#fcd65f", "#fccf47", "#f8c640", "#f4bf39", "#f1b834", "#efb430", "#eeb32f", "#efb430", "#f1b834", "#f4bf39", "#f8c640", "#fccf47"] }
choose = { field = ["#b283c7", "#bc8fd0", "#c499d7", "#cba2de", "#cfa7e2", "#d1a9e3", "#cfa7e2", "#cba2de", "#c499d7", "#bc8fd0", "#b283c7", "#a777bc", "#9d6db2", "#9664ab", "#915fa6", "#8f5da4", "#915fa6", "#9664ab", "#9d6db2", "#a777bc", "#b283c7"], night = ["#d0a4e4", "#d5ade8", "#dab4eb", "#debbee", "#e0bfef", "#e1c0f0", "#e0bfef", "#debbee", "#dab4eb", "#d5ade8", "#d0a4e4", "#c799dc", "#bf8fd5", "#b988d0", "#b583cc", "#b481cb", "#b583cc", "#b988d0", "#bf8fd5", "#c799dc", "#d0a4e4"] }
house = { field = ["#333964", "#314652", "#30503f", "#30572c", "#305c1b", "#305d12", "#305c1b", "#30572c", "#30503f", "#314652", "#333964", "#313d78", "#2f408a", "#2d4299", "#2b44a3", "#2b44a6", "#2b44a3", "#2d4299", "#2f408a", "#313d78", "#333964"], night = ["#dbc3c2", "#cac7ab", "#bbca95", "#aecc83", "#a5ce77", "#a2ce72", "#a5ce77", "#aecc83", "#bbca95", "#cac7ab", "#dbc3c2", "#c8bed5", "#b6b9e5", "#a8b4f1", "#9fb1f8", "#9cb0fb", "#9fb1f8", "#a8b4f1", "#b6b9e5", "#c8bed5", "#dbc3c2"] }

[bar.needs]
# Mixed in OKLab from P3 arm into arm_deep by ctrl-tokens: weight k is arm_deep's share at k/20,
# a cosine, as tokens.css's --sb-needs writes it.
from = "@arm"
to = "@arm_deep"
weights = [0.0, 0.024, 0.095, 0.206, 0.345, 0.5, 0.655, 0.794, 0.905, 0.976, 1.0, 0.976, 0.905, 0.794, 0.655, 0.5, 0.345, 0.206, 0.095, 0.024, 0.0]

[bar.hero]
# Ambient places only; while a needs-you lamp or bar is lit in a window it turns safe (B17).
at = [0.0, 0.11, 0.14, 0.25, 0.28, 0.31, 0.34, 0.45, 0.48, 0.58, 0.61, 0.64, 0.67, 0.77, 0.80, 0.89, 0.92, 0.97, 1.0]
field = ["#cd1f66", "#cd1f66", "#fc7392", "#fc7392", "#dbc3c2", "#dbc3c2", "#91b45e", "#91b45e", "#539624", "#539624", "#dbc3c2", "#dbc3c2", "#8ba0f1", "#8ba0f1", "#3d5ad9", "#3d5ad9", "#262b5b", "#262b5b", "#cd1f66"]
night = ["#cf2668", "#cf2668", "#fe799b", "#fe799b", "#dbc3c2", "#dbc3c2", "#98bd5e", "#98bd5e", "#5ea130", "#5ea130", "#dbc3c2", "#dbc3c2", "#8fa5fa", "#8fa5fa", "#4765e8", "#4765e8", "#2a2f63", "#2a2f63", "#cf2668"]

[bar.safe]
at = [0.0, 0.08, 0.20, 0.38, 0.50, 0.58, 0.70, 0.88, 1.0]
field = ["#333964", "#333964", "#305d12", "#305d12", "#333964", "#333964", "#2b44a6", "#2b44a6", "#333964"]
night = ["#dbc3c2", "#dbc3c2", "#a2ce72", "#a2ce72", "#dbc3c2", "#dbc3c2", "#9cb0fb", "#9cb0fb", "#dbc3c2"]

[bar.motion]
# A tile is base × the state's multiplier; one tile flows by per period (colour-proofs §M).
tile_full = 360.0
tile_compact = 240.0
tile_tip = 120.0
needs = { period = 1.75, tile = 0.5, opacity = 1.0 }
failed = { period = 3.5, tile = 0.75, opacity = 1.0 }
done = { period = 3.5, tile = 0.75, opacity = 1.0 }
working = { period = 7.0, tile = 1.0, opacity = 1.0 }
choose = { period = 7.0, tile = 1.0, opacity = 1.0 }
house = { period = 14.0, tile = 1.0, opacity = 0.7 }

[material]
# Depth by navy occlusion: inset on objects, a soft navy shadow only under what floats; never a
# grey shadow, never blur (B13). Night's shading is the blue-black #060714.
rim_mix = { field = 0.30, night = 0.60 }
press = 0.96
occl = { field = { color = "@occlusion", alpha = 0.16 }, night = { color = "@occlusion", alpha = 0.55 } }
occl_deep = { field = { color = "@occlusion", alpha = 0.28 }, night = { color = "@occlusion", alpha = 0.75 } }
occl_light = { field = { color = "@occlusion", alpha = 0.16 }, night = { color = "#262b5b", alpha = 0.22 } }
lip = { field = { color = "@overlay", alpha = 0.90 }, night = { color = "@cream", alpha = 0.20 } }
lip_hi = { field = { color = "@overlay", alpha = 1.0 }, night = { color = "@cream", alpha = 0.32 } }
lift = { field = { color = "@overlay", alpha = 0.55 }, night = { color = "@ink_1", alpha = 0.10 } }
pearl_lift = { field = { color = "@overlay", alpha = 0.85 }, night = { color = "@ink_1", alpha = 0.55 } }
needs_tint = { field = { color = "@arm", alpha = 0.06 }, night = { color = "@arm", alpha = 0.06 } }
failed_tint = { field = { color = "@amber_base", alpha = 0.10 }, night = { color = "@amber_base", alpha = 0.06 } }
# A pill's or key's ground and its ink: raised in Field, overlay in Night.
puff = { field = { color = "@raised", alpha = 1.0 }, night = { color = "@overlay", alpha = 1.0 } }
puff_ink = { field = { color = "@ink_1", alpha = 1.0 }, night = { color = "@ink_1", alpha = 1.0 } }

[material.well]
# inset 0 8 12 -8: deep panes, inputs, diffs.
y = 8.0
blur = 12.0
spread = { field = -8.0, night = -8.0 }
field = { color = "@occlusion", alpha = 0.22 }
night = { color = "@occlusion", alpha = 0.65 }

[[material.float]]
y = 24.0
blur = 48.0
spread = { field = -18.0, night = -16.0 }
field = { color = "@occlusion", alpha = 0.32 }
night = { color = "@occlusion", alpha = 0.70 }

[[material.float]]
y = 2.0
blur = 6.0
spread = { field = 0.0, night = 0.0 }
field = { color = "@occlusion", alpha = 0.12 }
night = { color = "@occlusion", alpha = 0.35 }

[radius]
# B3: continuous corners; nothing else (no --r-puffy).
xs = 4.0
s = 6.0
m = 10.0
l = 14.0
win = 16.0
xl = 20.0
pill = 999.0

[motion]
# One clock, T = 7 s: every duration is T × 2^n (B14). Loops phase-lock to a 14 s epoch.
t = 7.0
epoch = 14.0
tap = 0.109375
quick = 0.21875
state = 0.4375     # a state change; quick into needs-you (Q4)
scene = 0.875
beat = 1.75        # needs you only
breath = 3.5
cycle = 7.0
drift = 14.0
sine = [0.37, 0.0, 0.63, 1.0]
sine_out = [0.61, 1.0, 0.88, 1.0]
sine_in = [0.12, 0.0, 0.39, 0.0]
settle = [0.25, 1.0, 0.5, 1.0]
ambient = { min = 10.0, max = 30.0, preferred = 30.0 }
calm = { min = 8.0, max = 15.0, preferred = 15.0 }
hero = { min = 30.0, max = 60.0, preferred = 60.0 }

[motion.lamp]
# Per lamp (Bloom spec §5): `_period` and `_cue` in seconds, the rest amounts. One flat table, so
# the Swift reads `DS.Motion.Lamp.needsScale` (the U plan's names). Every cue but failed's is 0.
needs_period = 1.75
needs_scale = 1.16
bullseye = 1.7            # the needs ring, × the disc
needs_halo = 2.4
needs_halo_opacity = 0.7
arrival = 2.8
arrival_opacity = 0.6
working_period = 7.0
working_bands = 2.0       # Background's gradient carries the same two
bg_period = 7.0
done_from = 0.92
failed_period = 3.5
failed_cue = 2.625
failed_dip = 0.45
choose_period = 7.0
tide = 0.15
house_period = 14.0
house_rest = 0.8
house_low = 0.45
outside_period = 7.0
outside_rest = 0.8
outside_dip = 0.4
outside_dip_at = 0.875
idle_period = 14.0
idle_low = 0.82
gone = 0.35

