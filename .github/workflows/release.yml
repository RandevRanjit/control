name: Release

# Every push to main ships a signed, notarised nightly that the desktop app's update button
# installs. Stable releases are cut by hand (docs/operations/release.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "docs/**"
      - "design/**"
      - "**/*.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

# One at a time: a push during a run waits, and only the newest waiting push builds next.
concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the signing secrets
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is missing, so nothing is built: an unsigned app can't update itself."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Resolve the nightly version
        id: version
        run: |
          node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_number }}" --sha "$GITHUB_SHA" --github-output

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build, sign and notarise
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          APPLE_API_KEY="$key_path" CONTROL_DESKTOP_UPDATE_REPOSITORY="$GITHUB_REPOSITORY" \
            node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --build-version "${{ steps.version.outputs.version }}" --signed \
            --output-dir "$RUNNER_TEMP/release"

      # electron-builder notarises the app inside but leaves the DMG unsigned.
      - name: Sign, notarise and staple the DMG
        run: |
          trap 'echo "::error::Failed: $BASH_COMMAND"' ERR
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # codesign finds the identity only in a keychain on the search list, as electron-builder's does.
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          [[ -n "$identity" ]] || { echo "::error::CSC_LINK holds no Developer ID Application identity."; exit 1; }
          dmg="$(ls "$RUNNER_TEMP"/release/*.dmg)"
          codesign --force --timestamp --keychain "$keychain" --sign "$identity" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          node scripts/restamp-update-manifest.ts "$RUNNER_TEMP/release/nightly-mac.yml" "$dmg"
          security delete-keychain "$keychain"

      - name: Check the app
        run: |
          app_zip="$(ls "$RUNNER_TEMP"/release/*.zip)"
          ditto -x -k "$app_zip" "$RUNNER_TEMP/check"
          app="$(ls -d "$RUNNER_TEMP"/check/*.app)"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$(ls "$RUNNER_TEMP"/release/*.dmg)"

      - name: Publish the prerelease
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.name }}" \
            --prerelease --latest=false --generate-notes \
            ./*.dmg ./*.zip ./*.blockmap ./nightly-mac.yml
