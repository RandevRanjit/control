# CONTROL design tokens: the single source for the app's Swift (`DS`), CONTROL's terminal
# (Ghostty), the tmux theme and the Claude Code theme (ctrl-tokens).
# `UPDATE_GOLDEN=1 cargo test -p ctrl-tokens` regenerates the goldens and the app's Tokens.swift.
#
# Bloom (design/bloom/, owner-reviewed 5-6 Oct 2026), transcribed from
# design/bloom/engineering/tokens.css and proved in colour-proofs.md; print no colour that is not
# there. Laws: spec H13 as the Bloom spec amends it (docs/specs/2026-10-06-bloom.md §1.2).
#
# Two themes, Field (the default) and Night. A themed colour is { field = "#...", night = "#..." };
# "@key" names another token in that theme, one level deep, as tokens.css writes var(--...).
# sRGB hex throughout, except arm's Display P3 components (the one colour past sRGB, B5).

[meta]
name = "CONTROL"
source = "design/bloom/engineering/tokens.css (Bloom 2), 2026-10-06"
themes = ["field", "night"]
default = "field"

[color.surface]
field = { field = "#d6deee", night = "#2f2e2e" }
deep = { field = "#d6deee", night = "#1b1a1a" }       # terminal, chat, code, diffs
sunken = { field = "#cdd7ed", night = "#242323" }     # inputs, tracks
raised = { field = "#e3e9f4", night = "#383737" }
overlay = { field = "#edf1f9", night = "#424141" }
seam = { field = "#b9c2d9", night = "#4f4e4e" }
occlusion = { field = "#262b5b", night = "#060714" }  # shading only, never a fill (B22)
selection = "@blue_wash"

[color.ink]
ink_1 = { field = "#262b5b", night = "#f5ebe4" }
ink_2 = { field = "#333964", night = "#ebdcd5" }
ink_3 = { field = "#414970", night = "#c1c6d5" }
ink_4 = { field = "#525a7c", night = "#a9aebf" }
ghost = { field = "#7d85a0", night = "#767882" }
cream = { field = "#dbc3c2", night = "#dbc3c2" }
navy = { field = "#262b5b", night = "#2a2f63" }

[color.red]
# arm = needs you, the one signal red; danger = destructive consequence (B5).
arm = { field = "#d90e0b", night = "#ff4438", p3 = { field = [0.822, 0.085, 0.028], night = [0.993, 0.249, 0.161] } }
arm_dim = { field = "#e8ada5", night = "#6b2620" }
arm_deep = { field = "#861118", night = "#c22823" }
danger = { field = "#9b3a20", night = "#ea9d82" }

[color.family]
