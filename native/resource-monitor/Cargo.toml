[package]
name = "control-resource-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A standalone package, so cargo never adopts a Cargo workspace in a folder above the checkout.
[workspace]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
